name: 🧪 Build and smoke test snap

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      diagnostics-run:
        description: 'Read retained smoke-test logs from this repository run; leave empty for build/test'
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    name: Read retained desktop diagnostics
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics-run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Discover retained diagnostic artifacts
        id: available
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.diagnostics-run }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          logs=false
          screenshots=false
          while IFS= read -r name; do
            case "$name" in
              smoke-test-logs) logs=true ;;
              smoke-test-screenshots) screenshots=true ;;
            esac
          done <<< "$names"
          echo "logs=$logs" >> "$GITHUB_OUTPUT"
          echo "screenshots=$screenshots" >> "$GITHUB_OUTPUT"
          echo "Available diagnostics: logs=$logs, screenshots=$screenshots"
      - name: Download retained diagnostics
        if: steps.available.outputs.logs == 'true'
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-logs
          run-id: ${{ inputs.diagnostics-run }}
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Print bounded diagnostic text
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('application.log', 'connections.log', 'windows.log', 'display-backend.log'):
              path = Path('diagnostics') / name
              if path.is_file():
                  print(json.dumps({'file': name, 'text': path.read_bytes()[:131072].decode('utf-8', errors='replace')}))
          PY
      - name: Download retained desktop screenshots
        if: steps.available.outputs.screenshots == 'true'
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-screenshots
          run-id: ${{ inputs.diagnostics-run }}
          github-token: ${{ github.token }}
          path: screenshots
      - name: Print desktop preview for inspection
        if: hashFiles('screenshots/screenshot-screen.png') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          /usr/bin/python3 - <<'PY'
          import base64
          import io
          import json
          from pathlib import Path
          from PIL import Image
          path = Path('screenshots/screenshot-screen.png')
          with Image.open(path) as image:
              image.thumbnail((960, 720))
              output = io.BytesIO()
              image.convert('RGB').save(output, format='JPEG', quality=75)
          print(json.dumps({'desktop_preview_jpeg': base64.b64encode(output.getvalue()).decode()}))
          PY

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostics-run == ''
    name: 🔨 Build snap
    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --use-lxd

      - name: Show log on build failure
        if: failure()
        run: cat /home/runner/.local/state/snapcraft/log/snapcraft*.log

      - name: Review snap
        uses: diddlesnaps/snapcraft-review-action@v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          isClassic: 'false'

      - name: Upload snap artifact
        if: always() && steps.build.outputs.snap != ''
        uses: actions/upload-artifact@v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7

  smoke-test:
    name: 💨 Smoke test (launch + screenshot)
    runs-on: ubuntu-24.04
    needs: build
    # Use ghvmctl's supported guest default, as in the other graphical snaps.
    # Its current input tooling requires newer packages than Ubuntu 24.04 ships.

    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download snap artifact
        uses: actions/download-artifact@v4
        with:
          name: snap

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup LXD
        uses: canonical/setup-lxd@v0.1.1

      - name: Setup ghvmctl
        run: |
          sudo snap install ghvmctl
          sudo snap connect ghvmctl:lxd lxd:lxd

      - name: Prepare VM
        id: vm
        timeout-minutes: 15
        run: ghvmctl prepare

      - name: Install snap into VM
        run: |
          shopt -s nullglob
          snaps=(*.snap)
          test "${#snaps[@]}" -eq 1
          SNAP_FILE=${snaps[0]}
          echo "Pushing $SNAP_FILE into VM..."
          VM_NAME=$(ghvmctl exec hostname | tr -d '[:space:]')
          lxc file push "$SNAP_FILE" "local:$VM_NAME/home/ubuntu/$SNAP_FILE"
          ghvmctl exec sudo snap install --dangerous "/home/ubuntu/$SNAP_FILE"
          expected=$(python3 -c 'import re; print(re.search(r"^version: .([^\n]+).$", open("snap/snapcraft.yaml").read(), re.M)[1])')
          installed=$(ghvmctl exec snap list b2 --unicode=never | awk 'NR == 2 {print $2}')
          test "$installed" = "$expected"

      - name: Prepare desktop checks
        run: |
          ghvmctl exec sudo apt-get install -y xdotool x11-utils python3-pil
          # The decoration check uses X11 window/frame properties. Select the
          # matching SDL test backend in this disposable guest explicitly.
          ghvmctl exec systemctl --user set-environment SDL_VIDEODRIVER=x11
          # ghvmctl exec itself launches through systemd-run --user, so this
          # checks the inherited environment used by the application launcher.
          test "$(ghvmctl exec printenv SDL_VIDEODRIVER)" = x11
          VM_NAME=$(ghvmctl exec hostname | tr -d '[:space:]')
          lxc file push scripts/check-window.py "local:$VM_NAME/home/ubuntu/check-window.py"
          lxc file push scripts/render-check.py "local:$VM_NAME/home/ubuntu/render-check.py"
          printf '%s\n' '{"package":{"name":"b2","desktop_title":"b2","desktop_decorated":true,"desktop_backend":"sdl-x11"}}' > /tmp/input.json
          lxc file push /tmp/input.json "local:$VM_NAME/home/ubuntu/input.json"
          ghvmctl exec sudo chown ubuntu:ubuntu /home/ubuntu/input.json

      - name: Check rendered launch, survival and reopen
        # Two separately bounded ten-minute launches plus collection overhead.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p artifacts
          VM_NAME=$(ghvmctl exec hostname | tr -d '[:space:]')
          check_launch() {
            local attempt=$1 VM_NAME=$2
            ghvmctl snap-run b2
            ghvmctl exec python3 /home/ubuntu/check-window.py
            local rendered=false
            local deadline=$((SECONDS + 300))
            while (( SECONDS < deadline )); do
              ghvmctl snap-is-running b2
              if ghvmctl screenshot-window && ghvmctl exec python3 /home/ubuntu/render-check.py; then
                rendered=true
                break
              fi
              sleep 10
            done
            test "$rendered" = true
            ghvmctl snap-is-running b2
            lxc file pull "local:$VM_NAME/home/ubuntu/window.json" "artifacts/window-$attempt.json"
            lxc file pull "local:$VM_NAME/home/ubuntu/render.json" "artifacts/render-$attempt.json"
            cp "$HOME/ghvmctl-screenshots/screenshot-window.png" "artifacts/window-$attempt.png"
            ghvmctl screenshot-full
            ghvmctl snap-terminate b2
          }
          export -f check_launch
          for attempt in 1 2; do
            timeout --kill-after=10s 10m bash -euo pipefail -c 'check_launch "$@"' _ "$attempt" "$VM_NAME"
          done

      - name: Capture failure desktop
        if: failure() && steps.vm.outcome == 'success'
        continue-on-error: true
        run: ghvmctl screenshot-full

      - name: Collect application diagnostics
        if: always() && steps.vm.outcome == 'success'
        run: |
          mkdir -p artifacts
          ghvmctl exec cat /home/ubuntu/b2.log > artifacts/application.log 2>&1 || true
          ghvmctl exec sudo snap connections b2 > artifacts/connections.log 2>&1 || true
          ghvmctl exec xprop -root _NET_CLIENT_LIST > artifacts/windows.log 2>&1 || true
          ghvmctl exec printenv SDL_VIDEODRIVER > artifacts/display-backend.log 2>&1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('application.log', 'connections.log', 'windows.log', 'display-backend.log'):
              print(json.dumps({'file': name, 'text': (Path('artifacts') / name).read_bytes()[:131072].decode('utf-8', errors='replace')}))
          PY

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-screenshots
          path: ~/ghvmctl-screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize smoke test
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Desktop smoke test: $RESULT. See smoke-test-screenshots and smoke-test-logs artifacts for evidence." >> "$GITHUB_STEP_SUMMARY"
